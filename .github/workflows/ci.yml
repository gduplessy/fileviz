name: Build and test
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore FileViz.slnx --locked-mode
      - run: dotnet build FileViz.slnx -c Release --no-restore
      - run: dotnet test FileViz.slnx -c Release --no-build